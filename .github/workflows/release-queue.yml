name: Release Queue

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-status:
    name: Changeset status
    # Fork pull requests hold a read-only token, and the Version Packages branch
    # consumes changesets rather than adding them.
    if: >-
      github.repository_owner == 'scenesystems'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.status.outputs.comment-body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Diffs the changesets between the base and head refs and renders the
      # comment body, so the write token below never touches the checkout.
      - name: Summarize the changesets in this pull request
        id: status
        uses: changesets/action/pr-status@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  pr-comment:
    name: Changeset comment
    needs: pr-status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the changeset comment
        uses: changesets/action/pr-comment@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
