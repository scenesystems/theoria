name: Publish Packages

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  # Publishing must never be interrupted or overlap another publish.
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish Packages
    if: github.repository_owner == 'scenesystems' && github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Digest release evidence is certified on Node 22. npm Trusted
      # Publishing additionally requires Node >=22.14. npm 11.5.2 contains
      # the corrected OIDC package-visibility behavior.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm for Trusted Publishing
        run: |
          npm install --global npm@11.5.2
          node --version
          npm --version

      - uses: ./.github/actions/setup

      # `version` when unreleased changesets exist, `publish` when a package version is
      # missing from npm, `none` when the registry already matches the repository.
      - name: Select the Changesets mode
        id: mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

      - name: Refuse to publish with pending changesets
        if: steps.mode.outputs.mode == 'version'
        run: |
          echo "::error::Pending changesets remain. Merge the Version Packages PR before publishing."
          exit 1

      - name: Report an already published release
        if: steps.mode.outputs.mode == 'none'
        run: echo "::notice::Every package version is already published."

      # The publish sub-action reads the tags `changeset publish` reports through
      # CHANGESETS_OUTPUT, then pushes them and creates a GitHub release per package.
      - name: Publish unpublished package versions
        if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: bun run changeset:publish
        env:
          HUSKY: "0"
