name: Publish Packages
run-name: Publish Theoria candidate ${{ inputs.run_id }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Theoria staging candidate run ID
        required: true
        type: string
      reviewed_run_id:
        description: Optional earlier reviewed staging run; only version-only changes may follow it
        required: false
        type: string

concurrency:
  # The main dispatcher must not hold the lock needed by its pinned tag run.
  # All actual tag publications share one lock and never interrupt each other.
  group: npm-publish-${{ github.ref_type }}
  cancel-in-progress: false

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve staged candidate
    if: >-
      github.repository_owner == 'scenesystems' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/theoria-candidate-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      build-sha: ${{ steps.candidate.outputs.build-sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/theoria-candidate
        id: candidate
        with:
          run-id: ${{ inputs.run_id }}
          reviewed-run-id: ${{ inputs.reviewed_run_id }}
          publication-event: "true"

  pin:
    name: Start publication at the immutable candidate ref
    needs: resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      # npm provenance and changesets/action tags use the EVENT SHA, not the
      # checkout SHA. Dispatch again on the pinned ref; never override CI vars.
      - name: Pin the candidate and dispatch its publishing run
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.resolve.outputs.build-sha }}
          RUN_ID: ${{ inputs.run_id }}
          REVIEWED_RUN_ID: ${{ inputs.reviewed_run_id }}
        run: bun scripts/release.ts pin

  # Everything that executes repository or dependency code (type checks, lint,
  # tests, packing) runs here, without the OpenID Connect token. The tarballs it
  # produces are the only thing the publish job receives.
  pack:
    name: Pack Packages
    needs: resolve
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}
          fetch-depth: 0

      # Changesets uses npm pack even in a Bun workspace. Pin the same npm used to publish.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install npm for deterministic packing
        run: npm install --global npm@11.5.2

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/theoria-candidate
        id: candidate
        with:
          run-id: ${{ inputs.run_id }}
          reviewed-run-id: ${{ inputs.reviewed_run_id }}
          publication-event: "true"

      - name: Download staged package output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.candidate.outputs.package-artifact-id }}
          merge-multiple: true
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      # `version` when unreleased changesets exist, `publish` when a package version is
      # missing from npm, `none` when the registry already matches the repository.
      - name: Select the Changesets mode
        id: mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

      - name: Require finalized package versions
        env:
          CHANGESETS_MODE: ${{ steps.mode.outputs.mode }}
        run: bun scripts/release.ts ready

      - name: Typecheck workspace
        if: steps.mode.outputs.mode == 'publish'
        run: bun run check:all

      - name: Lint workspace
        if: steps.mode.outputs.mode == 'publish'
        run: bun run lint

      - name: Test workspace
        if: steps.mode.outputs.mode == 'publish'
        run: bun run test

      # Checks run before this comparison so they cannot silently alter what is packed.
      # Packages were built and version-resolved alongside the staged website; never rebuild here.
      - name: Verify staged output and reject changed already-published versions
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          RELEASE_OUTPUT: ${{ runner.temp }}/package-check.json
        run: bun scripts/release.ts check

      - name: Pack the unpublished package versions
        if: steps.mode.outputs.mode == 'publish'
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

      - name: Download packed tarballs for verification
        if: steps.mode.outputs.mode == 'publish'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/theoria-packed

      - name: Verify the exact tarballs before allowing npm credentials
        if: steps.mode.outputs.mode == 'publish'
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          PACKED_DIRECTORY: ${{ runner.temp }}/theoria-packed
        run: bun scripts/release.ts packed

  # Holds the OpenID Connect token for npm Trusted Publishing. It installs the
  # workspace only to resolve the Changesets CLI and publishes the packed
  # tarballs; no build or test code runs here. Tags and releases are created
  # through the GitHub API with the app token, so the job token stays read-only.
  publish:
    name: Publish Packages
    needs: [resolve, pack]
    # Job reruns can reuse stale prerequisite outputs. A fresh dispatch must
    # repeat candidate and package validation before requesting this environment.
    if: needs.pack.outputs.mode == 'publish' && github.run_attempt == '1'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}
          token: ${{ steps.app-token.outputs.token }}

      # Digest release evidence is certified on Node 22. npm Trusted
      # Publishing additionally requires Node >=22.14. npm 11.5.2 contains
      # the corrected OIDC package-visibility behavior.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm for Trusted Publishing
        run: |
          npm install --global npm@11.5.2
          node --version
          npm --version

      - uses: ./.github/actions/setup

      # Runs `changeset publish --from-pack-dir` against the downloaded tarballs,
      # then reads CHANGESETS_OUTPUT to push the tags and create a GitHub
      # release per package.
      - name: Publish the packed package versions
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          HUSKY: "0"

  record:
    name: Verify and record package publication
    needs: [resolve, pack, publish]
    if: >-
      always() && needs.pack.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/theoria-candidate
        id: candidate
        with:
          run-id: ${{ inputs.run_id }}
          reviewed-run-id: ${{ inputs.reviewed_run_id }}
      - name: Verify registry publication evidence
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          RELEASE_OUTPUT: ${{ runner.temp }}/publication.json
        run: bun scripts/release.ts published
      - name: Save publication record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theoria-publication-record
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: error
          retention-days: 90
