name: Publish Packages

on:
  workflow_dispatch:

concurrency:
  group: npm-publish
  # Publishing must never be interrupted or overlap another publish.
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish Packages
    if: github.repository_owner == 'scenesystems' && github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Digest release evidence is certified on Node 22. npm Trusted
      # Publishing additionally requires Node >=22.14. npm 11.5.2 contains
      # the corrected OIDC package-visibility behavior.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm for Trusted Publishing
        run: |
          npm install --global npm@11.5.2
          node --version
          npm --version

      - uses: ./.github/actions/setup

      - name: Refuse to publish with pending changesets
        shell: bash
        run: |
          pending=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -print -quit)
          if [ -n "$pending" ]; then
            echo "::error::Pending changesets remain. Merge the Version Packages PR before publishing."
            exit 1
          fi

      - name: Publish unpublished package versions
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: bun run changeset:publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          HUSKY: "0"
