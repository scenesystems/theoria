name: Theoria

# Builds the Theoria site once per commit, tests that exact build in workerd
# and Chromium on several runners at once, and deploys it to Cloudflare Workers.
# Pull requests only build and test; `theoria-preview.yml` deploys the uploaded
# build to a per-PR Worker with credentials the PR itself never sees, once this
# workflow — tests included — has succeeded. Pushes to `main` deploy to staging
# only. After reviewing staging, manually run `theoria-production.yml` with
# this run's ID to promote the tested artifact. See `apps/theoria/DEPLOYMENT.md`.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Pull requests build the merge commit but label the artifact with the head
  # SHA so `theoria-preview.yml` can find it from the `workflow_run` payload.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: theoria-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
      build-sha: ${{ steps.artifact.outputs.build-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup

      # `check.yml` runs the full suite for the same commit, but nothing links
      # the two workflows; gate the deployable artifact on the app's own checks
      # here as well.
      - name: Check Theoria app
        run: |
          bun run check:apps
          bun run test:apps

      - name: Build web bundle
        run: bun run --cwd apps/theoria build:web

      - name: Bundle Worker
        run: bun run --cwd apps/theoria deploy:dry-run

      - uses: ./.github/actions/theoria-build-check
        with:
          path: apps/theoria

      - name: Name artifact
        id: artifact
        run: |
          {
            echo "name=theoria-${BUILD_SHA}"
            echo "build-sha=${BUILD_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            apps/theoria/dist
            apps/theoria/.wrangler-out
            !apps/theoria/.wrangler-out/*.map
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}

  # Runs the bundle that will be deployed inside workerd against the built
  # `dist/` (routing, `_headers`, indexing policy, API, demo build) over HTTP
  # and in Chromium. The suite measures motion and layout, so its files run one
  # at a time on a runner; to finish sooner it runs on several runners at once,
  # each taking one shard cut by `apps/theoria/test/worker/sequencer.ts`. Every
  # shard tests the artifact the Build job uploaded, the one that is deployed.
  test:
    name: Test Worker (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: theoria-test-${{ github.event.pull_request.number || github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apps/theoria

      - uses: ./.github/actions/theoria-build-check
        with:
          path: apps/theoria

      # The workspace's own Playwright installs the browser build it launches;
      # `bunx playwright` would resolve the registry's latest release, whose
      # Chromium revision drifts from the one `@playwright/test` in the lockfile
      # expects.
      - name: Install Chromium for Worker browser tests
        run: bun run --cwd apps/theoria test:worker:browsers

      - name: Test Worker in workerd
        run: bun run --cwd apps/theoria test:worker -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  staging:
    name: Staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://theoria.staging.scenesystems.io
    concurrency:
      group: theoria-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: apps/theoria

      - uses: ./.github/actions/theoria-build-check
        with:
          path: apps/theoria

      - name: Deploy staging
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/theoria
          packageManager: bun
          command: >-
            deploy .wrangler-out/worker.js --no-bundle --env staging
            --var BUILD_SHA:${{ needs.build.outputs.build-sha }}
            --tag ${{ needs.build.outputs.build-sha }}

      - uses: ./.github/actions/theoria-verify-deployment
        with:
          url: https://theoria.staging.scenesystems.io
          build-sha: ${{ needs.build.outputs.build-sha }}
          noindex: "true"

      - name: Record the verified release candidate
        env:
          STAGED_SHA: ${{ needs.build.outputs.build-sha }}
          SITE_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          bash scripts/release/release.sh candidate "$STAGED_SHA" "$GITHUB_RUN_ID" "$SITE_ARTIFACT_ID" \
            > "$RUNNER_TEMP/release-candidate.json"

      - name: Upload candidate record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theoria-candidate
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
          retention-days: 7

      - name: Show production promotion instructions
        env:
          STAGED_SHA: ${{ needs.build.outputs.build-sha }}
        run: |
          {
            echo "## Staging verified; production is unchanged"
            echo
            echo "Review [staging](https://theoria.staging.scenesystems.io) for [commit $STAGED_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$STAGED_SHA)."
            echo
            echo "Candidate run_id: $GITHUB_RUN_ID. Later staging deployments do not change this candidate."
            echo
            echo "1. For new package versions, run [Publish Packages]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish.yml) on main with this run_id. It publishes this candidate, not newer main."
            echo "2. When ready, run [Theoria Production]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/theoria-production.yml) on main with the same run_id. It requires matching published package inputs and promotes this tested artifact without rebuilding."
            echo
            echo "If this finalizes a previously reviewed build's versions, optionally enter its reviewed_run_id in either workflow. Only verified version-only differences can carry that review forward."
            echo "The website artifact and candidate record expire seven days after upload."
          } >> "$GITHUB_STEP_SUMMARY"
