name: Theoria Production
run-name: Promote Theoria staging run ${{ inputs.run_id }} to production

# Production is an explicit choice after a successful Theoria staging run.
# Resolve the selected run before requesting production credentials, then use
# its artifact AND checkout so newer main commits cannot change the release.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Theoria staging run ID (not the run number or commit SHA)
        required: true
        type: string
      reviewed_run_id:
        description: Optional earlier reviewed staging run; only version-only changes may follow it
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve staged build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build-sha: ${{ steps.candidate.outputs.build-sha }}
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/theoria-candidate
        id: candidate
        with:
          run-id: ${{ inputs.run_id }}
          reviewed-run-id: ${{ inputs.reviewed_run_id }}

      - name: Require matching published package content
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
          RELEASE_OUTPUT: ${{ runner.temp }}/production-release.json
        run: bun scripts/release.ts published

      - name: Record production release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theoria-production-record
          path: ${{ runner.temp }}/production-release.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Production
    needs: resolve
    # Reusing a successful resolve from an earlier attempt bypasses validation.
    # Retry with a fresh dispatch, not a job/workflow rerun.
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://theoria.scenesystems.io
    concurrency:
      group: theoria-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}

      - uses: ./.github/actions/setup

      # An expired or missing artifact fails this step; never rebuild or fall
      # back to an artifact from a different run.
      - name: Download staged build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          merge-multiple: true
          path: apps/theoria
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - uses: ./.github/actions/theoria-build-check
        with:
          path: apps/theoria

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUILD_SHA: ${{ needs.resolve.outputs.build-sha }}
        run: bun scripts/release.ts deploy --target production
