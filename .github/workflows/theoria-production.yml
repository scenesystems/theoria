name: Theoria Production
run-name: Promote Theoria staging run ${{ inputs.run_id }} to production

# Production is an explicit choice after a successful Theoria staging run.
# Resolve the selected run before requesting production credentials, then use
# its artifact AND checkout so newer main commits cannot change the release.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Theoria staging run ID (not the run number or commit SHA)
        required: true
        type: string
      reviewed_run_id:
        description: Optional earlier reviewed staging run; only version-only changes may follow it
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve:
    name: Resolve staged build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build-sha: ${{ steps.candidate.outputs.build-sha }}
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: ./.github/actions/theoria-candidate
        id: candidate
        with:
          run-id: ${{ inputs.run_id }}
          reviewed-run-id: ${{ inputs.reviewed_run_id }}

      - name: Require matching published package inputs
        env:
          CANDIDATE: ${{ steps.candidate.outputs.path }}
        run: |
          bash scripts/release/release.sh published "$CANDIDATE" > "$RUNNER_TEMP/production-release.json"
          echo "All candidate packages match npm publication records. Website promotion is ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Record production release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: theoria-production-record
          path: ${{ runner.temp }}/production-release.json
          if-no-files-found: error
          retention-days: 90

  production:
    name: Production
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://theoria.scenesystems.io
    concurrency:
      group: theoria-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.build-sha }}

      - uses: ./.github/actions/setup

      # An expired or missing artifact fails this step; never rebuild or fall
      # back to an artifact from a different run.
      - name: Download staged build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact-id }}
          merge-multiple: true
          path: apps/theoria
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}

      - uses: ./.github/actions/theoria-build-check
        with:
          path: apps/theoria

      - name: Deploy production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/theoria
          packageManager: bun
          command: >-
            deploy .wrangler-out/worker.js --no-bundle --env=""
            --var BUILD_SHA:${{ needs.resolve.outputs.build-sha }}
            --tag ${{ needs.resolve.outputs.build-sha }}

      # The verify action waits up to ten minutes for DNS and, on a first
      # deploy, the certificate. See "Taking over a hostname" in the runbook.
      - uses: ./.github/actions/theoria-verify-deployment
        with:
          url: https://theoria.scenesystems.io
          build-sha: ${{ needs.resolve.outputs.build-sha }}
          noindex: "false"

      - name: Report the promoted build
        env:
          BUILD_SHA: ${{ needs.resolve.outputs.build-sha }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          {
            echo "## Production verified"
            echo
            echo "Promoted [commit $BUILD_SHA]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$BUILD_SHA) from [staging run $RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)."
            echo
            echo "[Open production](https://theoria.scenesystems.io)"
          } >> "$GITHUB_STEP_SUMMARY"
