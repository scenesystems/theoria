name: Theoria Preview

# Deploys the build that `theoria.yml` produced for a pull request to a per-PR
# Worker at https://theoria-pr-<N>.staging.scenesystems.io, and deletes that
# Worker when the pull request closes.
#
# This runs on `workflow_run`, so it executes on `main` with the `staging`
# environment's Cloudflare credentials. The pull request's code is never run
# here: only its build artifact is downloaded, checked, and uploaded with the
# Wrangler configuration from `main`. Pull requests from forks are not
# previewed. See `apps/theoria/DEPLOYMENT.md`.

on:
  workflow_run:
    workflows: [Theoria]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Identifies the pull request a completed build belongs to without trusting
  # `workflow_run.pull_requests`, whose order and contents are not guaranteed.
  # The build is previewed only when exactly one open pull request from this
  # repository into `main` currently has the built commit as its head.
  resolve:
    name: Resolve pull request
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr-number: ${{ steps.pull-request.outputs.number }}
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Find the open pull request for this build
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          numbers=$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              --field state=open \
              --field base=main \
              --field head="$GITHUB_REPOSITORY_OWNER:$HEAD_BRANCH" \
              --field per_page=100 |
            jq -r --arg repo "$GITHUB_REPOSITORY" --arg sha "$HEAD_SHA" '
              [ .[]
                | select(.state == "open")
                | select(.head.sha == $sha)
                | select(.head.repo.full_name == $repo)
                | select(.base.repo.full_name == $repo)
                | select(.base.ref == "main")
                | .number
              ] | @tsv
            '
          )

          case "$numbers" in
            "")
              echo "No open pull request into main has $HEAD_SHA as its head; skipping preview"
              echo "number=" >> "$GITHUB_OUTPUT"
              ;;
            *[!0-9]*)
              echo "Ambiguous pull requests for $HEAD_BRANCH@$HEAD_SHA: $numbers" >&2
              exit 1
              ;;
            *)
              echo "number=$numbers" >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    name: PR Preview
    needs: resolve
    if: needs.resolve.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://theoria-pr-${{ needs.resolve.outputs.pr-number }}.staging.scenesystems.io
    # Waits for, rather than cancels, an in-flight run for the same pull
    # request so a late build can never interrupt the `remove` job's cleanup.
    # The stale revision check below skips deployment once the queue drains.
    concurrency:
      group: theoria-pr-${{ needs.resolve.outputs.pr-number }}
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: theoria-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/theoria-build
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: ./.github/actions/theoria-build-check
        with:
          path: ${{ runner.temp }}/theoria-build

      - name: Stage build
        env:
          BUILD_DIR: ${{ runner.temp }}/theoria-build
        run: |
          rm -rf apps/theoria/dist apps/theoria/.wrangler-out
          cp -R "$BUILD_DIR/dist" apps/theoria/dist
          cp -R "$BUILD_DIR/.wrangler-out" apps/theoria/.wrangler-out

      - name: Confirm the pull request still points at this build
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r state head_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state, .head.sha] | @tsv'
          )

          if [ "$state" = "open" ] && [ "$head_sha" = "$HEAD_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping preview for PR $PR_NUMBER: state=$state current_head=$head_sha"
          fi

      - name: Deploy PR preview
        if: steps.current.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/theoria
          packageManager: bun
          command: >-
            deploy .wrangler-out/worker.js --no-bundle --env preview
            --name theoria-pr-${{ env.PR_NUMBER }}
            --domain theoria-pr-${{ env.PR_NUMBER }}.staging.scenesystems.io
            --var BUILD_SHA:${{ env.HEAD_SHA }}

      # The first deploy of a pull request creates a new Custom Domain, and its
      # certificate can take several minutes to issue; allow up to ten.
      - uses: ./.github/actions/theoria-verify-deployment
        if: steps.current.outputs.deploy == 'true'
        with:
          url: https://theoria-pr-${{ env.PR_NUMBER }}.staging.scenesystems.io
          build-sha: ${{ env.HEAD_SHA }}
          noindex: "true"
          attempts: "60"

  remove:
    name: Remove PR Preview
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      deployment: false
    concurrency:
      group: theoria-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER_NAME: theoria-pr-${{ github.event.pull_request.number }}
      PREVIEW_HOST: theoria-pr-${{ github.event.pull_request.number }}.staging.scenesystems.io
      ZONE_NAME: scenesystems.io

    steps:
      # Uses the script-settings endpoint rather than the script download, which
      # answers 204 for a Worker that exists (observed in production cleanups).
      - name: Find preview Worker
        id: preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/script-settings")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Cloudflare returned HTTP $status while locating $WORKER_NAME" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.preview.outputs.exists == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: ./.github/actions/setup
        if: steps.preview.outputs.exists == 'true'

      - name: Delete preview Worker
        if: steps.preview.outputs.exists == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/theoria
          packageManager: bun
          command: delete --name ${{ env.WORKER_NAME }} --env preview --force

      # Deleting the Worker removes its Custom Domain and DNS record, but
      # Cloudflare keeps the Advanced Certificate it issued for the hostname.
      # Those would accumulate against the zone's certificate limit, so remove
      # the pack whose only host is the preview hostname. Runs even when the
      # Worker was already gone so a previously interrupted cleanup completes.
      - name: Delete preview certificate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          zone_id=$(curl --silent --fail --header "$auth" \
            "$api/zones?name=$ZONE_NAME&status=active" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "Zone $ZONE_NAME not found or token cannot read zones" >&2
            exit 1
          fi

          # Only the Advanced Certificate whose sole host is the preview
          # hostname is ours. `status=all` also lists packs that are already
          # deleted or being deleted; skip those, but retry `deletion_timed_out`.
          packs=()
          page=1
          while :; do
            response=$(curl --silent --fail --header "$auth" \
              "$api/zones/$zone_id/ssl/certificate_packs?status=all&per_page=50&page=$page")
            mapfile -t page_packs < <(
              jq -r --arg host "$PREVIEW_HOST" '
                .result[]
                | select(.type == "advanced")
                | select(.hosts == [$host])
                | select(.status | IN("deleted", "pending_deletion") | not)
                | .id
              ' <<< "$response"
            )
            packs+=("${page_packs[@]}")
            count=$(jq -r '.result | length' <<< "$response")
            if [ "$count" -lt 50 ]; then
              break
            fi
            page=$((page + 1))
          done

          if [ "${#packs[@]}" -eq 0 ]; then
            echo "No certificate pack dedicated to $PREVIEW_HOST"
            exit 0
          fi

          for pack in "${packs[@]}"; do
            curl --silent --fail --show-error --output /dev/null --request DELETE \
              --header "$auth" "$api/zones/$zone_id/ssl/certificate_packs/$pack"
            echo "Deleted certificate pack $pack for $PREVIEW_HOST"
          done
