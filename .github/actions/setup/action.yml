name: Setup
description: Install bun and project dependencies

inputs:
  bun-version-file:
    description: File to read bun version from
    default: ".bun-version"

runs:
  using: composite
  steps:
    - name: Install bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: ${{ inputs.bun-version-file }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
