name: Setup
description: Install bun and project dependencies

inputs:
  bun-version-file:
    description: File to read bun version from
    default: ".bun-version"

runs:
  using: composite
  steps:
    - name: Install bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: ${{ inputs.bun-version-file }}

    # Bun 1.3.9's JavaScriptCore fragments a multi-gigabyte heap into more
    # memory mappings than Linux allows by default (vm.max_map_count = 65530)
    # and then retries madvise forever at the limit. The API reference
    # generator peaks at 65-85k mappings, so give it headroom.
    - name: Raise the memory-mapping limit
      if: runner.os == 'Linux'
      shell: bash
      run: sudo sysctl -w vm.max_map_count=262144

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
