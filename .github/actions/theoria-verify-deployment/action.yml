name: Verify Theoria deployment
description: Verify deployed SHA, routes, indexing policy, demo API and static assets through the Effect release program.
inputs:
  url:
    description: Deployment origin
    required: true
  build-sha:
    description: Expected deployed commit
    required: true
  noindex:
    description: Require noindex for staging and previews
    required: true
  attempts:
    description: Health polls (allows time for first-deploy DNS and certificate propagation)
    default: "60"
  delay-seconds:
    description: Seconds between health polls
    default: "10"
runs:
  using: composite
  steps:
    - name: Verify deployment
      shell: bash
      env:
        BASE_URL: ${{ inputs.url }}
        BUILD_SHA: ${{ inputs.build-sha }}
        NOINDEX: ${{ inputs.noindex }}
        ATTEMPTS: ${{ inputs.attempts }}
        DELAY_SECONDS: ${{ inputs.delay-seconds }}
      run: bun scripts/release.ts verify
