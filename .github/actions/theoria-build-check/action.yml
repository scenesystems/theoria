name: Check Theoria build output
description: >
  Verify that a Theoria build directory is deployable: the Vite bundle in `dist/`
  and the pre-bundled Worker in `.wrangler-out/`. Every `dist/` file must have a
  content type the server serves (`apps/theoria/app/server/config/static-store.ts`);
  the rule lives in `apps/theoria/app/server/config/build-output.ts`. Used on the
  build output before it is uploaded and again on a downloaded artifact before it
  is deployed. Requires `./.github/actions/setup` to have run.

inputs:
  path:
    description: Directory that contains `dist/` and `.wrangler-out/` (normally `apps/theoria`)
    default: apps/theoria

runs:
  using: composite
  steps:
    - name: Check build output
      shell: bash
      env:
        BUILD_ROOT: ${{ inputs.path }}
      run: BUILD_ROOT="$(realpath "$BUILD_ROOT")" bun run --cwd apps/theoria build:check
